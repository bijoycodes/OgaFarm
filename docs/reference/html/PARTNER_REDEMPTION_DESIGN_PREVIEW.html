const K='ogafarm_partner_campaigns_demo_v44',Q='ogafarm_reward_claims_demo_v44';const get=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}};const put=(k,a)=>localStorage.setItem(k,JSON.stringify(a));const out=document.getElementById('result');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('check').onclick=()=>{const code=document.getElementById('code').value.trim().toUpperCase(),a=get(Q),v=a.find(x=>x.id===code),p=get(K).find(x=>x.id===v?.partnerId);if(!v)return out.textContent='No matching demo voucher.';if(v.status!=='issued-demo')return out.textContent='Voucher already used or unavailable.';if(Date.now()>Date.parse(v.expires))return out.textContent='Voucher expired.';if(!p||p.status!=='approved'||p.verificationStatus!=='verified-demo'||p.membershipStatus!=='paid-demo'||p.memberEnd<new Date().toISOString().slice(0,10))return out.textContent='Partner membership inactive.';out.innerHTML='<strong>DEMO VALID: '+esc(v.discount)+'% · '+esc(v.company)+'</strong><p>Not a real discount or real subscriber check.</p><button id="use">Mark redeemed · DEMO</button>';document.getElementById('use').onclick=()=>{const b=get(Q),x=b.find(x=>x.id===code);if(!x||x.status!=='issued-demo'||Date.now()>Date.parse(x.expires))return out.textContent='No longer valid.';x.status='redeemed-demo';x.redeemedAt=new Date().toISOString();put(Q,b);out.textContent='Marked redeemed in this browser demo. Reuse blocked in this browser only.'}}
</script></html>
